name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  collaboration-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate collaboration documents only
        run: |
          test -s README.md
          test -s CONTRIBUTING.md
          test -s .gitignore
          test -s .github/pull_request_template.md
          echo "Collaboration documents validated." >> "$GITHUB_STEP_SUMMARY"
